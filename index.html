<meta charset="utf-8"><title>메디신피아 대시보드 (사내용)</title>
<style>
:root{color-scheme:light dark}
.gate-wrap{min-height:96vh;display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
.gate-box{background:#fcfcfb;border:1px solid rgba(11,11,11,.1);border-radius:12px;
  padding:36px 40px;max-width:360px;width:90%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);color:#0b0b0b}
@media (prefers-color-scheme:dark){.gate-box{background:#1a1a19;border-color:rgba(255,255,255,.1);color:#fff}}
:root[data-theme="dark"] .gate-box{background:#1a1a19;border-color:rgba(255,255,255,.1);color:#fff}
.gate-logo{font-size:15px;font-weight:700;color:#2a78d6;letter-spacing:.02em;margin-bottom:4px}
.gate-box h1{font-size:16px;font-weight:700;margin:0 0 6px}
.gate-box p.d{font-size:12.5px;color:#898781;margin:0 0 20px}
.gate-box input{font:inherit;font-size:14px;width:100%;box-sizing:border-box;padding:10px 12px;
  border:1px solid #c3c2b7;border-radius:8px;background:inherit;color:inherit;text-align:center}
.gate-box input:focus{outline:2px solid #2a78d6;outline-offset:1px}
.gate-box button{font:inherit;font-size:14px;font-weight:600;width:100%;margin-top:10px;padding:10px;
  border:none;border-radius:8px;background:#2a78d6;color:#fff;cursor:pointer}
.gate-box button:disabled{opacity:.6;cursor:wait}
.gate-err{font-size:12.5px;color:#d03b3b;margin-top:10px;min-height:18px}
.gate-note{font-size:11px;color:#898781;margin-top:16px;line-height:1.5}
</style>
<div class="gate-wrap"><div class="gate-box">
  <div class="gate-logo">MEDICINPIA</div>
  <h1>전문가 입점 영업 대시보드</h1>
  <p class="d">사내 공유용 · 비밀번호를 입력해주세요</p>
  <form id="gateF">
    <input type="password" id="gatePw" placeholder="비밀번호" autofocus autocomplete="current-password">
    <button id="gateBtn" type="submit">열기</button>
  </form>
  <div class="gate-err" id="gateErr"></div>
  <div class="gate-note">이 페이지의 데이터는 AES-256으로 암호화되어 있어<br>비밀번호 없이는 내용을 볼 수 없습니다.</div>
</div></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(P.s), iterations:P.it, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
  return new TextDecoder().decode(plain);
}
document.getElementById('gateF').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('gateBtn'), err = document.getElementById('gateErr');
  btn.disabled = true; btn.textContent = '확인 중…'; err.textContent = '';
  try{
    const html = await unlock(document.getElementById('gatePw').value);
    document.open(); document.write(html); document.close();
  }catch(_){
    err.textContent = '비밀번호가 올바르지 않습니다';
    btn.disabled = false; btn.textContent = '열기';
    document.getElementById('gatePw').select();
  }
});
if(!crypto.subtle){
  document.getElementById('gateErr').textContent = '이 브라우저에서는 열 수 없습니다. 크롬/엣지 최신 버전을 사용해주세요.';
}
